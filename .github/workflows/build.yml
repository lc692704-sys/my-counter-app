name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: "34.0.0"
          sdk-version: "34"

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Complete Android Build Tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "ndk;25.1.8937393"

      - name: Verify Android SDK Installation
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "=== Build Tools Available ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools/" || echo "build-tools directory not found"
          echo "=== Checking for AIDL ==="
          if [ -f "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl" ]; then
            echo "✓ AIDL found at $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl"
          else
            echo "✗ AIDL not found, reinstalling build-tools..."
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          fi

      - name: Install Python and Pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-dev

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get install -y libssl-dev libffi-dev build-essential
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython
          pip install kivy
          python3 -m pip install --force-reinstall buildozer
          buildozer --version

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}-v3

      - name: Build with Buildozer
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.1.8937393
          PATH: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0:${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.PATH }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: package
          path: bin/*.apk

      - name: Upload Build Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            .buildozer/android/platform/build-*/*.log
            .buildozer/logs
