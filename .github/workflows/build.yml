name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04 # Uses the fastest available modern runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Upgraded to v4

      # Cache Buildozer global directory to make future builds faster
      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4 # Upgraded to v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

      # Run the Buildozer action to compile the APK
      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          buildozer_version: stable
          command: buildozer android debug
          repository_read_token: ${{ secrets.GITHUB_TOKEN }}

      # Upload the compiled APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # Upgraded to v4 to fix the error!
        with:
          name: package
          path: bin/*.apk
